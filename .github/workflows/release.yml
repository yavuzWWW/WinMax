name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
  MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          TAG_VERSION="${RELEASE_TAG#v}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          [[ "$TAG_VERSION" == "$PLIST_VERSION" ]] || {
            echo "Tag version $TAG_VERSION does not match Info.plist version $PLIST_VERSION" >&2
            exit 1
          }
          [[ -n "$PLIST_BUILD" ]]
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$(git rev-parse HEAD)" ]]
          echo "WINMAX_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "WINMAX_BUILD=$PLIST_BUILD" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/winmax.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo 'SIGNING_MODE=Developer ID signed' >> "$GITHUB_ENV"

      - name: Use ad-hoc signing
        if: env.MACOS_CERTIFICATE_BASE64 == ''
        run: |
          echo 'CODE_SIGN_IDENTITY=-' >> "$GITHUB_ENV"
          echo 'SIGNING_MODE=ad-hoc signed (not Apple notarized)' >> "$GITHUB_ENV"

      - name: Build and validate
        run: ./scripts/check.sh

      - name: Notarize app
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/WinMax.app "$RUNNER_TEMP/WinMax-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/WinMax-notary.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/WinMax.app
          xcrun stapler validate build/WinMax.app
          echo 'SIGNING_MODE=Developer ID signed + Apple notarized' >> "$GITHUB_ENV"

      - name: Package branded release
        run: WINMAX_SKIP_BUILD=1 ./scripts/package.sh

      - name: Notarize DMG
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/WinMax-$WINMAX_VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/WinMax-$WINMAX_VERSION.dmg"
          xcrun stapler validate "dist/WinMax-$WINMAX_VERSION.dmg"
          shasum -a 256 "dist/WinMax-$WINMAX_VERSION.dmg" "dist/WinMax-$WINMAX_VERSION.zip" > dist/SHA256SUMS.txt
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          WinMax $WINMAX_VERSION

          Signing: $SIGNING_MODE

          See CHANGELOG.md for the full release notes.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/WinMax-$WINMAX_VERSION.dmg" \
              "dist/WinMax-$WINMAX_VERSION.zip" \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WinMax $WINMAX_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              "dist/WinMax-$WINMAX_VERSION.dmg" \
              "dist/WinMax-$WINMAX_VERSION.zip" \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "WinMax $WINMAX_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets)"
          [[ "$(jq -r '.isDraft' <<<"$JSON")" == "false" ]]
          [[ "$(jq -r '.isPrerelease' <<<"$JSON")" == "false" ]]
          NAMES="$(jq -r '.assets[].name' <<<"$JSON")"
          grep -Fxq "WinMax-$WINMAX_VERSION.dmg" <<<"$NAMES"
          grep -Fxq "WinMax-$WINMAX_VERSION.zip" <<<"$NAMES"
          grep -Fxq 'SHA256SUMS.txt' <<<"$NAMES"
          echo "Verified release: $(jq -r '.url' <<<"$JSON")"
          echo "Signing: $SIGNING_MODE"
