name: Publish WinMax v1.0.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.yml"

permissions:
  contents: write

concurrency:
  group: publish-winmax-v1
  cancel-in-progress: false

env:
  WINMAX_VERSION: "1.0.0"
  MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
  MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [[ "$PLIST_VERSION" != "$WINMAX_VERSION" ]]; then
            echo "Info.plist version $PLIST_VERSION does not match $WINMAX_VERSION" >&2
            exit 1
          fi
          echo "WINMAX_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/winmax.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Use ad-hoc signing
        if: env.MACOS_CERTIFICATE_BASE64 == ''
        run: echo 'CODE_SIGN_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build and validate
        run: ./scripts/check.sh

      - name: Notarize app
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          ditto -c -k --keepParent build/WinMax.app "$RUNNER_TEMP/WinMax-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/WinMax-notary.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/WinMax.app

      - name: Package branded installer
        run: WINMAX_SKIP_BUILD=1 ./scripts/package.sh

      - name: Notarize DMG
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit "dist/WinMax-$WINMAX_VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/WinMax-$WINMAX_VERSION.dmg"
          shasum -a 256 "dist/WinMax-$WINMAX_VERSION.dmg" "dist/WinMax-$WINMAX_VERSION.zip" > dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # WinMax 1.0.0

          First public release of WinMax by Vast Hosting.

          ## Highlights
          - Windows-style maximize/restore on macOS
          - Green button override without separate fullscreen Spaces
          - Double-click title bar maximize/restore
          - Control + Command + F override
          - Drag-down restore behavior
          - Native Vast Hosting-branded settings UI
          - Guided first-run Accessibility setup
          - Branded drag-to-Applications DMG installer
          - Launch at login
          - Universal Apple Silicon + Intel build
          - Local diagnostics with no telemetry

          ## Downloads
          Use the `.dmg` installer for normal installation. The `.zip` is provided as an alternative portable archive. Verify downloads with `SHA256SUMS.txt` if desired.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$WINMAX_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WinMax $WINMAX_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" \
              "dist/WinMax-$WINMAX_VERSION.dmg" \
              "dist/WinMax-$WINMAX_VERSION.zip" \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              "dist/WinMax-$WINMAX_VERSION.dmg" \
              "dist/WinMax-$WINMAX_VERSION.zip" \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "WinMax $WINMAX_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
