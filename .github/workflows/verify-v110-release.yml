name: Verify WinMax v1.1.0 Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v110-release.yml"

permissions:
  contents: write
  actions: read

env:
  TARGET_SHA: 5537be433c8358efe86868ec657f567a1e5edb4b
  RELEASE_TAG: v1.1.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Wait for public release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OK=0
          for i in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
              DRAFT="$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")"
              PRE="$(jq -r '.isPrerelease' "$RUNNER_TEMP/release.json")"
              NAMES="$(jq -r '.assets[].name' "$RUNNER_TEMP/release.json")"
              if [[ "$DRAFT" == "false" && "$PRE" == "false" ]] \
                && grep -Fxq 'WinMax-1.1.0.dmg' <<<"$NAMES" \
                && grep -Fxq 'WinMax-1.1.0.zip' <<<"$NAMES" \
                && grep -Fxq 'SHA256SUMS.txt' <<<"$NAMES"; then
                OK=1
                break
              fi
            fi
            sleep 10
          done
          [[ "$OK" == "1" ]] || { echo "Timed out waiting for complete v1.1.0 release" >&2; exit 1; }
          echo "RELEASE_URL=$(jq -r '.url' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"

      - name: Verify release workflow and signing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          CONCLUSION=""
          for i in $(seq 1 60); do
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&per_page=30")"
            RUN_ID="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$RUNS" | head -1)"
            if [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]]; then
              STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
              CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
              [[ "$STATUS" == "completed" ]] && break
            fi
            sleep 10
          done
          [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]] || { echo "Release workflow run not found" >&2; exit 1; }
          [[ "$CONCLUSION" == "success" ]] || { echo "Release workflow did not succeed: $CONCLUSION" >&2; exit 1; }

          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          step_result() {
            jq -r --arg name "$1" '[.jobs[].steps[] | select(.name == $name) | .conclusion][0] // "missing"' <<<"$JOBS"
          }

          DEV_ID="$(step_result 'Import Developer ID certificate')"
          ADHOC="$(step_result 'Use ad-hoc signing')"
          NOTARY_APP="$(step_result 'Notarize app')"
          NOTARY_DMG="$(step_result 'Notarize DMG')"

          if [[ "$DEV_ID" == "success" && "$NOTARY_APP" == "success" && "$NOTARY_DMG" == "success" ]]; then
            SIGNING_MODE="Developer ID signed + Apple notarized"
          elif [[ "$ADHOC" == "success" ]]; then
            SIGNING_MODE="ad-hoc signed (not Apple notarized)"
          elif [[ "$DEV_ID" == "success" ]]; then
            SIGNING_MODE="Developer ID signed (notarization not completed)"
          else
            SIGNING_MODE="unknown"
          fi

          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"

      - name: Record verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEXT="WinMax v1.1.0 public release verified
Target: $TARGET_SHA
Assets: WinMax-1.1.0.dmg, WinMax-1.1.0.zip, SHA256SUMS.txt
Signing: $SIGNING_MODE
Release: $RELEASE_URL
Release workflow run: $RELEASE_RUN_ID
"
          CONTENT="$(printf '%s' "$TEXT" | base64 -w 0)"
          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/RELEASE_VERIFIED_1_1_0" \
            -f message='chore: record verified WinMax 1.1.0 release' \
            -f content="$CONTENT" \
            -f branch=main
