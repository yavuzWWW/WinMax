name: Inspect Direct WinMax v1.1.0 Publisher

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/status-v110-simple.yml"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read direct publisher state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-v110-direct.yml/runs?per_page=1" --jq '.workflow_runs[0].id')"
          [[ -n "$RUN_ID" ]] || { echo 'No direct publisher run found' >&2; exit 1; }
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // "pending"')"
          URL="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.html_url')"
          TEXT="Run: $RUN_ID
Status: $STATUS
Conclusion: $CONCLUSION
URL: $URL
"
          CONTENT="$(printf '%s' "$TEXT" | base64 -w 0)"
          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/RELEASE_DIRECT_STATUS_1_1_0" \
            -f message='chore: record direct WinMax 1.1.0 publisher status' \
            -f content="$CONTENT" \
            -f branch=main
