name: Bug report
description: Report incorrect WinMax window behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please open WinMax and use **Copy diagnostics** before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe what you expected and what WinMax did instead.
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application affected
      placeholder: Safari, Discord, Terminal, etc.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: WinMax diagnostics
      description: Paste the output from WinMax → Copy diagnostics.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. WinMax ...
    validations:
      required: true
